[project]
name = "consumer-knowledge-graph"
version = "1.0.0"
description = "Evidence-grounded mobile consumer ontology and knowledge graph"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "psycopg[binary]>=3.2,<4", "neo4j>=5.24,<7", "httpx>=0.27,<1", "python-json-logger>=2,<4", "PyYAML>=6,<7", "alembic>=1.13,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
[tool.ruff]
line-length=110

[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
include=["app*", "scripts*"]
[tool.setuptools.package-data]
app = ["static/*"]
